name: unit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/events
      - run: node tests/run-node-tests.mjs
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/events
      - run: node tests/run-node-tests.mjs
