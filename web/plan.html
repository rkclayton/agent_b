<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent_b</title>
  <link rel="icon" href="/static/assets/Agent_b.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/plan.css">
</head>
<body class="plan-page" data-page="plan">
  <header id="app-shell" class="app-shell window-titlebar" data-page="plan"></header>
  <main class="plan-workspace" aria-label="Plan">
    <nav class="plan-flyout" aria-label="Plans">
      <div class="plan-flyout-head">
        <input id="plan-search" type="search" aria-label="Search plans" placeholder="search" autocomplete="off" spellcheck="false">
        <button id="plan-add" class="plan-add" type="button" aria-label="Add a plan" title="Add a plan for a folder">+</button>
      </div>
      <form id="plan-add-form" class="plan-add-form" hidden>
        <input id="plan-add-path" aria-label="Folder for the new plan" placeholder="folder path, then Enter" autocomplete="off" spellcheck="false">
        <p id="plan-add-error" class="plan-add-error" hidden></p>
      </form>
      <div id="plan-build" class="plan-build" role="group" aria-label="Build plan now?" hidden>
        <span>Build plan now?</span><button id="plan-build-yes" type="button">Yes</button><button id="plan-build-no" type="button">No</button>
      </div>
      <ul id="plan-list" class="plan-list"></ul>
      <p id="plan-list-empty" class="plan-list-empty" hidden>No plans yet. + adds one for a folder.</p>
    </nav>
    <section class="plan-view" aria-label="Plan document">
      <header class="plan-panel-head"><span id="plan-name">Plan</span><button type="button" id="plan-go" class="plan-go" disabled>Go</button></header>
      <div id="plan-lint" class="plan-lint" role="status" hidden></div>
      <p id="plan-refusal" class="plan-refusal" hidden></p>
      <div id="plan-done" class="plan-done" hidden></div>
      <div class="plan-body">
        <pre id="plan-raw" class="plan-raw" aria-label="plan.md, read-only"></pre>
        <dl id="plan-stats" class="plan-stats" aria-label="Plan statistics"></dl>
      </div>
    </section>
  </main>
  <script type="module" src="/static/js/build-check.js"></script>
  <script type="module" src="/static/js/plan.js"></script>
</body>
</html>
