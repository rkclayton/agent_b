name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run packages supported by the hosted Windows environment
        shell: pwsh
        run: |
          $excluded = @(
            'harness/cmd/harness',
            'harness/internal/session',
            'harness/internal/tools',
            'harness/internal/web'
          )
          $packages = @(go list ./... | Where-Object { $_ -notin $excluded })
          go test @packages
      - run: go test -race ./internal/events ./internal/projection
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race configuration saves once
        run: go test -race ./internal/web -run '^(TestRequestWatchdogRecordsOneBoundedStackAndSkipsStreams2ry|TestConfigPOSTAssignsConnectionsToLetteredAgentRoles|TestConfigPOSTStoresConnectionSecretOutsideJSON|TestConfigPOSTRetainsSchemaStamp|TestConfigUpdatePersistsAgentsInActiveProfile|TestMachineFileKeepsItsOwnPerProfileSections2m0)$' -count=1
      - run: node tests/run-node-tests.mjs
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run portable packages
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -vE '^harness/(internal/agent|internal/tools)$')
          go test "${packages[@]}"
      - run: go test -race ./internal/events ./internal/projection
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race configuration saves once
        run: go test -race ./internal/web -run '^(TestRequestWatchdogRecordsOneBoundedStackAndSkipsStreams2ry|TestConfigPOSTAssignsConnectionsToLetteredAgentRoles|TestConfigPOSTStoresConnectionSecretOutsideJSON|TestConfigPOSTRetainsSchemaStamp|TestConfigUpdatePersistsAgentsInActiveProfile|TestMachineFileKeepsItsOwnPerProfileSections2m0)$' -count=1
      - run: node tests/run-node-tests.mjs
