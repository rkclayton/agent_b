name: unit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - name: Run packages supported by the hosted Windows environment
        shell: pwsh
        run: |
          $excluded = @(
            'harness/cmd/harness',
            'harness/internal/session',
            'harness/internal/tools',
            'harness/internal/web'
          )
          $packages = @(go list ./... | Where-Object { $_ -notin $excluded })
          go test @packages
      - run: go test -race ./internal/events
      - run: node tests/run-node-tests.mjs
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - name: Run portable packages
        shell: bash
        run: |
          mapfile -t packages < <(go list ./... | grep -vE '^harness/(internal/agent|internal/tools)$')
          go test "${packages[@]}"
      - run: go test -race ./internal/events
      - run: node tests/run-node-tests.mjs
