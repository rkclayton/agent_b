name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run every package and report each package
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'go-test.json'
          go test -json ./... 2>&1 | Tee-Object -FilePath $result
          $testExit = $LASTEXITCODE
          node tests/gate-result.mjs --go-json $result
          if ($testExit -ne 0) { exit $testExit }
      - run: go test -race ./internal/events ./internal/projection ./internal/broker
      - run: go test -race ./internal/agent -run '^TestReadGroupsRunFourAtOnceAndChangesStayOrdered2rs$' -count=1
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race configuration saves once
        run: go test -race ./internal/web -run '^(TestRequestWatchdogRecordsOneBoundedStackAndSkipsStreams2ry|TestConfigPOSTAssignsConnectionsToLetteredAgentRoles|TestConfigPOSTStoresConnectionSecretOutsideJSON|TestConfigPOSTRetainsSchemaStamp|TestConfigUpdatePersistsAgentsInActiveProfile|TestMachineFileKeepsItsOwnPerProfileSections2m0)$' -count=1
      - run: node tests/run-node-tests.mjs
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run every package and report each package
        shell: bash
        run: |
          result="$RUNNER_TEMP/go-test.json"
          set +e
          go test -json ./... | tee "$result"
          test_exit=${PIPESTATUS[0]}
          set -e
          node tests/gate-result.mjs --go-json "$result"
          exit "$test_exit"
      - run: go test -race ./internal/events ./internal/projection ./internal/broker
      - run: go test -race ./internal/agent -run '^TestReadGroupsRunFourAtOnceAndChangesStayOrdered2rs$' -count=1
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race configuration saves once
        run: go test -race ./internal/web -run '^(TestRequestWatchdogRecordsOneBoundedStackAndSkipsStreams2ry|TestConfigPOSTAssignsConnectionsToLetteredAgentRoles|TestConfigPOSTStoresConnectionSecretOutsideJSON|TestConfigPOSTRetainsSchemaStamp|TestConfigUpdatePersistsAgentsInActiveProfile|TestMachineFileKeepsItsOwnPerProfileSections2m0)$' -count=1
      - run: node tests/run-node-tests.mjs
