name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run every package and report each package
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'go-test.json'
          go test -p 1 -json ./... 2>&1 | Tee-Object -FilePath $result
          $testExit = $LASTEXITCODE
          node tests/gate-result.mjs --go-json $result
          if ($testExit -ne 0) { exit $testExit }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-go-test
          path: ${{ runner.temp }}/go-test.json
      - run: go test -race ./internal/events ./internal/projection ./internal/broker
      - run: go test -race ./internal/agent -run '^TestReadGroupsRunFourAtOnceAndChangesStayOrdered2rs$' -count=1
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race internal/web
        run: go test -race -timeout 30m ./internal/web -count=1
      - run: node tests/run-node-tests.mjs
  # Item 2x0 (e): install, launch, over the top with an older configuration,
  # uninstall keeping the data, fresh install over it — on a clean runner.
  install-cycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The runner's token is elevated and Agent_b refuses one, so the build (it runs
      # the exe) and the cycle run under runas's Basic User token, as a person's would.
      - name: Build, install, upgrade, uninstall and reinstall as a standard user
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install-cycle.log'
          $done = Join-Path $env:RUNNER_TEMP 'install-cycle.exit'
          $script = Join-Path $env:RUNNER_TEMP 'install-cycle.cmd'
          @(
            '@echo off',
            "set `"PATH=$env:PATH`"",
            'set PSModulePath=',
            "cd /d `"$PWD`"",
            "powershell.exe -NoLogo -NoProfile -NonInteractive -File tools\build-candidate.ps1 -GeneralPrivacyOnly > `"$log`" 2>&1",
            "if errorlevel 1 (>`"$done`" echo 1 & exit /b 1)",
            "powershell.exe -NoLogo -NoProfile -NonInteractive -File tests\install-cycle.ps1 >> `"$log`" 2>&1",
            ">`"$done`" echo %ERRORLEVEL%"
          ) | Set-Content -LiteralPath $script -Encoding ascii
          runas.exe /trustlevel:0x20000 "cmd.exe /d /c `"$script`""
          $deadline = (Get-Date).AddMinutes(30)
          while (-not (Test-Path -LiteralPath $done) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if (-not (Test-Path -LiteralPath $done)) { throw 'the install cycle did not finish within 30 minutes' }
          $code = [int](Get-Content -LiteralPath $done -Raw).Trim()
          if ($code -ne 0) { throw "the install cycle exited $code" }
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go vet ./...
      - run: node tools/privacy-gate.mjs --general-only
      - name: Run every package and report each package
        shell: bash
        run: |
          result="$RUNNER_TEMP/go-test.json"
          set +e
          go test -p 1 -json ./... | tee "$result"
          test_exit=${PIPESTATUS[0]}
          set -e
          node tests/gate-result.mjs --go-json "$result"
          exit "$test_exit"
      - run: go test -race ./internal/events ./internal/projection ./internal/broker
      - run: go test -race ./internal/agent -run '^TestReadGroupsRunFourAtOnceAndChangesStayOrdered2rs$' -count=1
      - name: Race delete-running-chat fifty times
        run: go test -race ./internal/web -run '^TestDeleteDeletesOpenAndRunningChatsAndLeavesNoCopy2py$' -count=50
      - name: Race internal/web
        run: go test -race -timeout 30m ./internal/web -count=1
      - run: node tests/run-node-tests.mjs
